name: iOS Build (Capacitor)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Copy web assets
        run: npx cap copy ios

      - name: Setup Ruby xcodeproj
        run: gem install xcodeproj

      # 玩具页 + app 专属入口 + 三个扩展 target（灵动岛 / 共享屏幕 / 屏幕时间）。
      # 原来这里是散着的两步 ruby，只建了 widget 一个；现在跟 Mac 走同一条路，
      # 免得「CI 编出来的」和「她 Mac 上编出来的」不是同一个东西。
      # CI 上没有 toy.html（在 .gitignore 里），脚本会明确报出来，不静默。
      - name: Prep iOS (web assets + extension targets)
        run: bash scripts/ios-prep.sh

      - name: Build
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath $PWD/build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Verify Widget Extension
        run: |
          APP_PATH=$(find ios/App/build/derived -name "*.app" -type d -path "*/Release-iphoneos/*" 2>/dev/null | head -1)
          if [ -d "$APP_PATH/PlugIns/LiveActivityWidget.appex" ]; then
            echo "✅ Widget Extension found in .app bundle"
          else
            echo "⚠️ Widget Extension NOT found — Xcode target may not be configured"
            find "$APP_PATH/PlugIns" -maxdepth 1 -type d 2>/dev/null | head -10 || echo "No PlugIns directory"
          fi

      - name: Package .ipa
        run: |
          cd ios/App
          APP_PATH=$(find build/derived -name "*.app" -type d -path "*/Release-iphoneos/*" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/derived -name "*.app" -type d 2>/dev/null | head -1)
          fi
          if [ -n "$APP_PATH" ]; then
            echo "Found: $APP_PATH"
            cd "$(dirname "$APP_PATH")"
            mkdir -p Payload
            cp -r "$(basename "$APP_PATH")" Payload/
            mkdir -p "$GITHUB_WORKSPACE/ios/App/build/ipa"
            zip -q -r "$GITHUB_WORKSPACE/ios/App/build/ipa/eclat.ipa" Payload
            echo "✅ éclat.ipa 已生成"
          else
            echo "❌ 找不到 .app"
            find build/derived -maxdepth 5 -type d 2>/dev/null | head -20
            exit 1
          fi

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: éclat-iOS
          path: ios/App/build/ipa/eclat.ipa
          if-no-files-found: error
