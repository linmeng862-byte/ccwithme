<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45">
<defs><style>
.sdb-body{animation:sdb-tremble 2.2s infinite ease-in-out;transform-origin:7.5px 10px}
.sdb-tear{animation:sdb-tear 1.6s infinite ease-in;opacity:0}
@keyframes sdb-tremble{0%,100%{transform:translateY(0)}12%{transform:translateY(.4px)}24%{transform:translateY(-.2px)}36%{transform:translateY(.2px)}48%{transform:translateY(0)}}
@keyframes sdb-tear{0%{opacity:0;transform:translateY(0)}18%{opacity:.85}55%{opacity:.35;transform:translateY(3px)}100%{opacity:0;transform:translateY(6px)}}
</style></defs>
<!-- shadow -->
<rect x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>
<!-- legs -->
<g fill="#DE886D"><rect x="3" y="11" width="1" height="4"/><rect x="5" y="11" width="1" height="4"/><rect x="9" y="11" width="1" height="4"/><rect x="11" y="11" width="1" height="4"/></g>
<!-- body -->
<g class="sdb-body">
  <rect x="2" y="6" width="11" height="7" fill="#DE886D"/><!-- torso -->
  <!-- drooping arms -->
  <rect x="0" y="10" width="2" height="2" fill="#DE886D"/>
  <rect x="13" y="10" width="2" height="2" fill="#DE886D"/>
  <!-- sad eyes: smaller, looking down -->
  <g fill="#000000"><rect x="4" y="9" width="1" height="1.5"/><rect x="10" y="9" width="1" height="1.5"/></g>
</g>
<!-- tears -->
<g class="sdb-tear"><rect x="4.2" y="11.5" width=".8" height="1.2" rx=".3" fill="#7EB8D8"/></g>
<g class="sdb-tear" style="animation-delay:.8s"><rect x="10.2" y="11.5" width=".8" height="1.2" rx=".3" fill="#7EB8D8"/></g>
</svg>
