<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .clawd_nervous__body-tremble {
        transform-origin: 7.5px 13px;
        animation: clawd_nervous__tremble 0.12s infinite alternate ease-in-out;
      }
      .clawd_nervous__eyes-squint {
        transform-origin: 7.5px 9px;
        animation: clawd_nervous__squint-blink 2s infinite ease-in-out;
      }
      .clawd_nervous__sweat {
        animation: clawd_nervous__sweat-drop 1.5s infinite ease-in;
      }
      .clawd_nervous__legs-shake {
        animation: clawd_nervous__leg-clawd_nervous__tremble 0.15s infinite alternate ease-in-out;
      }
      @keyframes clawd_nervous__tremble {
        0% { transform: translate(-0.4px, 0.2px) scale(1.01, 0.99); }
        100% { transform: translate(0.4px, -0.2px) scale(0.99, 1.01); }
      }
      @keyframes clawd_nervous__squint-blink {
        0%, 70%, 80%, 100% { transform: scaleY(0.25); }
        75% { transform: scaleY(0.05); }
      }
      @keyframes clawd_nervous__sweat-drop {
        0% { opacity: 0.8; transform: translate(0, 0); }
        80% { opacity: 0.5; transform: translate(0, 3px); }
        100% { opacity: 0; transform: translate(0, 5px); }
      }
      @keyframes clawd_nervous__leg-tremble {
        0% { transform: translate(-0.2px, 0); }
        100% { transform: translate(0.2px, 0); }
      }
    </style>
  </defs>

  <!-- Shadow -->
  <rect x="3" y="15" width="9" height="1" fill="#000" opacity="0.5"/>

  <!-- Legs trembling -->
  <g class="clawd_nervous__legs-shake" fill="#DE886D">
    <rect x="3" y="11" width="1" height="4"/>
    <rect x="5" y="11" width="1" height="4"/>
    <rect x="9" y="11" width="1" height="4"/>
    <rect x="11" y="11" width="1" height="4"/>
  </g>

  <!-- Body trembling -->
  <g class="clawd_nervous__body-clawd_nervous__tremble">
    <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
    <!-- Arms pulled in tight -->
    <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
    <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
    <!-- Squinted eyes -->
    <g class="clawd_nervous__eyes-squint" fill="#000">
      <rect x="4" y="8.5" width="1" height="1.5"/>
      <rect x="10" y="8.5" width="1" height="1.5"/>
    </g>
    <!-- Mouth (nervous wavy line) -->
    <g fill="#000" opacity="0.5">
      <rect x="6" y="11" width="1" height="0.5"/>
      <rect x="7" y="10.5" width="1" height="0.5"/>
      <rect x="8" y="11" width="1" height="0.5"/>
    </g>
  </g>

  <!-- Sweat drop -->
  <g class="clawd_nervous__sweat" fill="#5CB8FF">
    <rect x="12" y="5" width="1" height="1"/>
    <rect x="12" y="6" width="1" height="1"/>
    <rect x="12.5" y="7" width="0.5" height="0.5"/>
  </g>
</svg>
