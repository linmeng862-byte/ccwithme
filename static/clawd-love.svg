<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45">
<defs><style>
.lv-body{animation:lv-bounce 1.5s infinite ease-in-out;transform-origin:7.5px 10px}
.lv-heart{animation:lv-float var(--d,2s) var(--delay,0s) infinite ease-out;opacity:0}
@keyframes lv-bounce{0%,100%{transform:translateY(0)}20%{transform:translateY(-2.5px)}40%{transform:translateY(0)}60%{transform:translateY(-1.2px)}80%{transform:translateY(0)}}
@keyframes lv-float{0%{opacity:0;transform:translate(0,0) scale(.2)}15%{opacity:1;transform:translate(var(--tx,0),-3px) scale(1)}55%{opacity:.5;transform:translate(var(--tx2,0),-10px) scale(.7)}100%{opacity:0;transform:translate(var(--tx3,0),-18px) scale(.2)}}
</style></defs>
<!-- shadow -->
<rect x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>
<!-- legs -->
<g fill="#DE886D"><rect x="3" y="11" width="1" height="4"/><rect x="5" y="11" width="1" height="4"/><rect x="9" y="11" width="1" height="4"/><rect x="11" y="11" width="1" height="4"/></g>
<!-- body -->
<g class="lv-body">
  <rect x="2" y="6" width="11" height="7" fill="#DE886D"/><!-- torso -->
  <rect x="0" y="9" width="2" height="2" fill="#DE886D"/><!-- left arm -->
  <rect x="13" y="9" width="2" height="2" fill="#DE886D"/><!-- right arm -->
  <!-- happy eyes: wider -->
  <g fill="#000000"><rect x="3.5" y="8" width="2" height="1.5"/><rect x="9.5" y="8" width="2" height="1.5"/></g>
</g>
<!-- floating hearts -->
<g class="lv-heart" style="--d:1.8s;--delay:0s;--tx:-4px;--tx2:-6px;--tx3:-8px"><rect x="3" y="-3" width="1" height="1" fill="#F4A8B8"/><rect x="2" y="-4" width="3" height="1" fill="#F4A8B8"/><rect x="1" y="-5" width="5" height="1" fill="#F4A8B8"/><rect x="2" y="-6" width="3" height="1" fill="#F4A8B8"/><rect x="3" y="-7" width="1" height="1" fill="#F4A8B8"/></g>
<g class="lv-heart" style="--d:1.8s;--delay:.6s;--tx:3px;--tx2:5px;--tx3:6px"><rect x="11" y="-2" width="1" height="1" fill="#E8A0B0"/><rect x="10" y="-3" width="3" height="1" fill="#E8A0B0"/><rect x="9" y="-4" width="5" height="1" fill="#E8A0B0"/><rect x="10" y="-5" width="3" height="1" fill="#E8A0B0"/><rect x="11" y="-6" width="1" height="1" fill="#E8A0B0"/></g>
<g class="lv-heart" style="--d:2s;--delay:1.1s;--tx:0;--tx2:-2px;--tx3:-3px"><rect x="6" y="-5" width="1" height="1" fill="#F4A8B8"/><rect x="5" y="-6" width="3" height="1" fill="#F4A8B8"/><rect x="4" y="-7" width="5" height="1" fill="#F4A8B8"/><rect x="5" y="-8" width="3" height="1" fill="#F4A8B8"/><rect x="6" y="-9" width="1" height="1" fill="#F4A8B8"/></g>
</svg>
